<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabi, carnet de voyage</title>
<meta name="description" content="Ton voyage jour par jour : itinéraire qui se recalcule, fiches illustrées, adresses de locaux, carte et guide pratique.">
<meta name="theme-color" content="#1F4FA8">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/skins.css">
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main" style="overflow-x:clip"><div class="splash"><div><div class="hanko" aria-hidden="true">旅</div><p class="small" style="margin-top:12px">Préparation du carnet…</p></div></div></main>
  <p class="foot-note">Temps de trajet estimés. Images Wikimedia Commons, cartes © OpenStreetMap et CARTO.</p>
</div>
<nav class="nav" id="nav" hidden aria-label="Sections">
  <div class="nav-in">
    <button type="button" data-tab="jours"><svg class="ni" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nk">日</span><span class="nl">Jours</span></button>
    <button type="button" data-tab="carte"><svg class="ni" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg><span class="nk">図</span><span class="nl">Carte</span></button>
    <button type="button" data-tab="lieux"><svg class="ni" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="nk">所</span><span class="nl">Lieux</span></button>
    <button type="button" data-tab="guide"><svg class="ni" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z"/><path d="M4 5.5v16"/></svg><span class="nk">案</span><span class="nl">Guide</span></button>
    <button type="button" data-tab="mots"><svg class="ni" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9h8M8 12h5"/></svg><span class="nk">語</span><span class="nl">Mots</span></button>
  </div>
</nav>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetIn"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Image agrandie" hidden></div>
<script>
/* Chargeur : une destination = un pack JSON. ?d=japon (par défaut). */
(function(){
  try{const th=localStorage.getItem("tabi-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
  const FONTS={ciel:"Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700",aurora:"Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700",pop:"Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700"};
  window.applySkin=function(sk,save){const r=document.documentElement;if(!["washi","ciel","aurora","pop"].includes(sk))sk="ciel";r.dataset.skin=sk;
    if(FONTS[sk]&&!document.getElementById("f-"+sk)){const l=document.createElement("link");l.id="f-"+sk;l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+FONTS[sk]+"&display=swap";document.head.appendChild(l)}
    if(save)try{localStorage.setItem("tabi-skin",sk)}catch(e){}};
  let sk0=new URLSearchParams(location.search).get("skin");try{sk0=sk0||localStorage.getItem("tabi-skin")}catch(e){}
  applySkin(sk0||"ciel");
  const V="8";
  const id=(new URLSearchParams(location.search).get("d")||"japon").replace(/[^a-z0-9-]/g,"");
  const load=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src+"?v="+V;s.onload=ok;s.onerror=()=>ko(new Error(src));document.body.appendChild(s)});
  const fail=msg=>{document.getElementById("main").innerHTML=`<div class="splash"><div><div class="hanko">旅</div><p style="margin-top:12px">${msg}</p><button class="btn" onclick="location.reload()">Réessayer</button></div></div>`};
  fetch(`packs/${id}/pack.json?v=${V}`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(async pack=>{
    window.PACK=pack;document.title=pack.brand;
    const sk=pack.skin||{};const rs=document.documentElement.style;["d1","d2","d3"].forEach(k=>{if(sk[k])rs.setProperty("--"+k,sk[k])});
    await load("vendor/leaflet/leaflet.js").catch(()=>{});
    for(const f of ["data","scenes","extra","art","map","share","trip","views","app"])await load(`app/${f}.js`);
  }).catch(e=>{console.error(e);fail("Impossible de charger le carnet. Vérifie la connexion.")});
})();
</script>
</body>
</html>
